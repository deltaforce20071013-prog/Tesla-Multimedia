
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Tesla Multimedia</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div id="stage">
  <div id="monitor">
    <div id="app">

      <!-- DOIMIY YUQORI PANEL -->
      <header class="top-bar">
        <div class="time" id="clock">00:00</div>
        <div class="status">TESLA MULTIMEDIA</div>
        <div class="temperature">22°C</div>
      </header>

      <!-- ASOSIY DASHBOARD -->
      <main id="main-screen">

        <section id="vehicle-section">
          <h2>My Vehicle</h2>
          <div class="vehicle-placeholder">
            <svg viewBox="0 0 220 360" width="85%" height="85%">
              <rect x="25" y="85" width="22" height="65" rx="7" fill="#050505"/>
              <rect x="173" y="85" width="22" height="65" rx="7" fill="#050505"/>
              <rect x="25" y="215" width="22" height="65" rx="7" fill="#050505"/>
              <rect x="173" y="215" width="22" height="65" rx="7" fill="#050505"/>
              <path d="M75 15 Q110 0 145 15 L175 65 Q188 90 188 125 L188 265 Q188 310 155 340 Q110 360 65 340 Q32 310 32 265 L32 125 Q32 90 45 65 Z" fill="#333" stroke="#aaa" stroke-width="2"/>
              <path d="M67 70 Q110 48 153 70 L165 135 L55 135 Z" fill="#263b48" stroke="#777" stroke-width="2"/>
              <path d="M55 145 L165 145 L165 235 L55 235 Z" fill="#18252e" stroke="#777" stroke-width="2"/>
              <path d="M55 245 L165 245 L153 300 Q110 325 67 300 Z" fill="#263b48" stroke="#777" stroke-width="2"/>
              <path d="M45 38 L72 32 M175 38 L148 32" stroke="white" stroke-width="5" stroke-linecap="round"/>
              <path d="M65 320 L155 320" stroke="red" stroke-width="5"/>
            </svg>
          </div>
        </section>

        <section id="navigation-section">
          <h2>Navigation</h2>
          <div class="map-placeholder">MAP</div>
        </section>

        <section id="music-section">
          <h2>Media Player</h2>
          <div class="music-placeholder">No media playing</div>
        </section>

      </main>

      <!-- KAMERA EKRANI -->
      <section id="camera-screen" hidden>
        <div class="camera-header">
          <h2>CAMERA SYSTEM</h2>
          <span>DEMO MODE</span>
        </div>

        <div class="camera-grid">
          <div class="camera-view">
            <span>FRONT CAMERA</span>
            <div class="camera-scene">FRONT VIEW</div>
          </div>
          <div class="camera-view">
            <span>REAR CAMERA</span>
            <div class="camera-scene">REAR VIEW</div>
          </div>
          <div class="camera-view">
            <span>LEFT CAMERA</span>
            <div class="camera-scene">LEFT VIEW</div>
          </div>
          <div class="camera-view">
            <span>RIGHT CAMERA</span>
            <div class="camera-scene">RIGHT VIEW</div>
          </div>
        </div>

        <div class="camera-footer">
          CAMERA SYSTEM — ALL VIEWS
        </div>
      </section>

      <!-- DOIMIY PASTKI MENYU -->
      <nav class="bottom-menu">
        <button id="vehicleBtn" aria-label="Vehicle">🚘</button>
        <button id="musicBtn" aria-label="Music">🎵</button>
        <button id="cameraBtn" aria-label="Camera">📷</button>
        <button id="phoneBtn" aria-label="Phone">📞</button>
        <button id="settingsBtn" aria-label="Settings">⚙️</button>
      </nav>

    </div>
  </div>
</div>

<script src="script.js?v=9"></script>
</body>
</html>
